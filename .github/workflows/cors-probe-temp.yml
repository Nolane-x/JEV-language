name: Temporary TypeSafe CORS Probe

on:
  push:
    branches:
      - fix/playground-pointer-cors-literals
    paths:
      - ".github/workflows/cors-probe-temp.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe models CORS preflight
        shell: bash
        run: |
          set -o pipefail
          echo "=== GET /v1/models preflight ==="
          curl -sS -D - -o /dev/null -X OPTIONS "https://api.typesafe.ai/v1/models"             -H "Origin: https://nolane-x.github.io"             -H "Access-Control-Request-Method: GET"             -H "Access-Control-Request-Headers: authorization" || true

      - name: Probe systemone CORS preflight
        shell: bash
        run: |
          set -o pipefail
          echo "=== POST /v1/systemone preflight ==="
          curl -sS -D - -o /dev/null -X OPTIONS "https://api.typesafe.ai/v1/systemone"             -H "Origin: https://nolane-x.github.io"             -H "Access-Control-Request-Method: POST"             -H "Access-Control-Request-Headers: authorization,content-type" || true
