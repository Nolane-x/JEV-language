name: Deploy TypeSafe Relay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/relay-deploy.trigger"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy locked-down relay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Ensure workers.dev subdomain
        id: subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          code="$(curl --silent --show-error             --output /tmp/cf-subdomain.json             --write-out '%{http_code}'             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header "Content-Type: application/json"             "$api")"

          existing="$(node <<'NODE'
          const fs = require("node:fs");
          let body = {};
          try { body = JSON.parse(fs.readFileSync("/tmp/cf-subdomain.json", "utf8")); } catch {}
          process.stdout.write(body?.result?.subdomain || "");
          NODE
          )"

          if [ -n "$existing" ]; then
            echo "subdomain=$existing" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "failure-reason=authorization" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare rejected the configured API credentials"
            exit 1
          fi

          candidate="nolane-${CLOUDFLARE_ACCOUNT_ID:0:12}"
          create_code="$(curl --silent --show-error             --request PUT             --output /tmp/cf-subdomain-create.json             --write-out '%{http_code}'             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header "Content-Type: application/json"             --data "{\"subdomain\":\"$candidate\"}"             "$api")"

          created="$(node <<'NODE'
          const fs = require("node:fs");
          let body = {};
          try { body = JSON.parse(fs.readFileSync("/tmp/cf-subdomain-create.json", "utf8")); } catch {}
          if (body?.success === true && body?.result?.subdomain) {
            process.stdout.write(body.result.subdomain);
          }
          NODE
          )"

          if [ -n "$created" ]; then
            echo "subdomain=$created" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$create_code" = "401" ] || [ "$create_code" = "403" ]; then
            echo "failure-reason=authorization" >> "$GITHUB_OUTPUT"
          elif [ "$create_code" = "404" ]; then
            echo "failure-reason=account" >> "$GITHUB_OUTPUT"
          else
            echo "failure-reason=subdomain" >> "$GITHUB_OUTPUT"
          fi
          echo "::error::Unable to read or create the Cloudflare workers.dev subdomain"
          exit 1

      - name: Deploy relay
        id: deploy
        if: steps.subdomain.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ steps.subdomain.outputs.subdomain }}
        run: |
          set +e
          (
            cd relay
            npx --yes wrangler@4 deploy
          ) 2>&1 | tee /tmp/wrangler-deploy.log
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            reason="wrangler_failure"
            if grep -Eqi 'auth|permission|not authorized|unauthorized|forbidden|code[^0-9]*(10000|9109)' /tmp/wrangler-deploy.log; then
              reason="authorization"
            elif grep -Eqi 'account[^[:alnum:]]+(invalid|not found|unknown)|invalid account' /tmp/wrangler-deploy.log; then
              reason="account"
            elif grep -Eqi 'workers\.dev|subdomain' /tmp/wrangler-deploy.log; then
              reason="subdomain"
            fi
            echo "failure-reason=$reason" >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi

          relay_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$relay_url" ] && [ -n "$WORKERS_SUBDOMAIN" ]; then
            relay_url="https://jev-language-typesafe-relay.$WORKERS_SUBDOMAIN.workers.dev"
          fi

          if [ -z "$relay_url" ]; then
            echo "failure-reason=missing_deployment_url" >> "$GITHUB_OUTPUT"
            echo "::error::Wrangler deployed without a discoverable workers.dev URL"
            exit 1
          fi

          echo "deployment-url=$relay_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed relay
        id: verify
        if: steps.deploy.outcome == 'success'
        env:
          RELAY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$RELAY_URL" ]; then
            echo "::error::Wrangler did not return a deployment URL"
            exit 1
          fi

          echo "Relay URL: $RELAY_URL"

          ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              --header "Origin: https://nolane-x.github.io" \
              --dump-header /tmp/relay-health.headers \
              --output /tmp/relay-health.json \
              "$RELAY_URL/health"; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Relay health endpoint did not become reachable"
            exit 1
          fi

          grep -q '"ok":true' /tmp/relay-health.json
          grep -q '"stores_credentials":false' /tmp/relay-health.json
          grep -q '"browser_contract":"jev-relay-browser-v2"' /tmp/relay-health.json
          grep -qiF 'access-control-allow-origin: https://nolane-x.github.io' /tmp/relay-health.headers
          grep -qiF 'x-jev-relay: 1' /tmp/relay-health.headers
          grep -qiF 'access-control-expose-headers:' /tmp/relay-health.headers
          grep -qiE 'access-control-expose-headers:.*x-jev-relay' /tmp/relay-health.headers

          curl --fail --silent --show-error \
            --request OPTIONS \
            --header "Origin: https://nolane-x.github.io" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: Authorization,Accept" \
            --dump-header /tmp/relay-cors.headers \
            --output /dev/null \
            "$RELAY_URL/v1/models"

          grep -qiF 'access-control-allow-origin: https://nolane-x.github.io' /tmp/relay-cors.headers
          grep -qiE 'access-control-expose-headers:.*x-jev-relay' /tmp/relay-cors.headers

          authless_code="$(curl --silent --show-error             --header "Origin: https://nolane-x.github.io"             --dump-header /tmp/relay-authless.headers             --output /tmp/relay-authless.json             --write-out '%{http_code}'             "$RELAY_URL/v1/models")"
          test "$authless_code" = "401"
          grep -qiF 'x-jev-relay: 1' /tmp/relay-authless.headers
          grep -qiE 'access-control-expose-headers:.*x-jev-relay' /tmp/relay-authless.headers
          grep -q 'Authorization header is required' /tmp/relay-authless.json

          {
            echo "## TypeSafe relay deployed"
            echo
            echo "Relay URL: $RELAY_URL"
            echo
            echo "- workers.dev bootstrap: verified"
            echo "- Browser health endpoint + relay identity: verified"
            echo "- Browser-readable X-JEV-Relay exposure: verified"
            echo "- Browser contract jev-relay-browser-v2: verified"
            echo "- Verified 401 error envelope: verified"
            echo "- GitHub Pages CORS preflight: verified"
            echo "- TypeSafe API key: not used or stored by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
