name: Multilingual Live Baseline

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to spend exactly 12 TypeSafe/Jev requests for the multilingual baseline"
        required: true
        default: "NO"
  push:
    branches:
      - main
    paths:
      - .github/multilingual-live-baseline.trigger

permissions:
  contents: write

jobs:
  multilingual-live-baseline:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run bounded multilingual live baseline
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_ALLOW_LIVE: "1"
          JEV_LIVE_MAX_REQUESTS: "12"
          JEV_RELAY_URL: "https://jev-language-typesafe-relay.nolane-file.workers.dev"
        run: |
          npx tsx scripts/multilingual-live-baseline.ts > /tmp/multilingual-live-baseline.json
          cat /tmp/multilingual-live-baseline.json

      - name: Freeze sanitized evidence
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          cp /tmp/multilingual-live-baseline.json docs/evidence/MULTILINGUAL-LIVE-BASELINE.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/MULTILINGUAL-LIVE-BASELINE.json
          git commit -m "chore: record multilingual live baseline evidence [skip ci]"
          git push origin HEAD:main
