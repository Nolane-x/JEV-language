name: Multilingual Live Baseline

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to spend exactly 12 TypeSafe/Jev requests for the multilingual baseline"
        required: true
        default: "NO"

permissions:
  contents: read

jobs:
  multilingual-live-baseline:
    if: ${{ inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run bounded multilingual live baseline
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_ALLOW_LIVE: "1"
          JEV_LIVE_MAX_REQUESTS: "12"
          JEV_RELAY_URL: "https://jev-language-typesafe-relay.nolane-file.workers.dev"
        run: npx tsx scripts/multilingual-live-baseline.ts
