name: Deploy Playground

on:
  push:
    branches: ["main"]
    paths:
      - "playground/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Pages setup diagnostic
        if: failure()
        run: |
          echo "::error::GitHub Pages is not configured for this repository. Open Settings → Pages and set Source to GitHub Actions, then re-run this workflow."
      - name: Upload playground
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./playground
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
