name: Playground Relay Authenticated Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to spend exactly one TypeSafe/Jev request through the verified relay"
        required: true
        default: "NO"

permissions:
  contents: read

jobs:
  live-relay-smoke:
    if: ${{ inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: One-request authenticated relay smoke
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_ALLOW_LIVE: "1"
          JEV_LIVE_MAX_REQUESTS: "1"
          JEV_RELAY_URL: "https://jev-language-typesafe-relay.nolane-file.workers.dev"
        run: npx tsx scripts/playground-relay-live-smoke.ts
